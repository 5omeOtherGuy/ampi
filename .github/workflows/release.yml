# release-please keeps a release PR open from the Conventional Commits on main
# (version bump in package.json plus CHANGELOG.md). Merging that PR tags
# vX.Y.Z, creates the GitHub Release, and publishes to npm in the same run.
# The CLI package in packages/ampi-cli is versioned separately (tags
# ampi-cli-vX.Y.Z) and is published after @skippermissions/ampi when both
# release together, so its dependency on the new ampi version resolves.
#
# Needs, from the owner:
# - a GitHub App installed on this repository (contents, pull requests and
#   issues: read and write), its client ID in the variable
#   RELEASE_APP_CLIENT_ID and its private key in the secret
#   RELEASE_APP_PRIVATE_KEY. A PR opened with the default GITHUB_TOKEN would
#   get no CI run.
# - npm trusted publishing for @skippermissions/ampi and
#   @skippermissions/ampi-cli pointing at this repository and this workflow
#   file (release.yml). No npm token is stored.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One release run at a time; a running release is never cancelled. A newer
# pending run can replace an older pending one, which the provenance check in
# the publish job guards against.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    # Skipped (not failed) until the owner has set up the release App.
    if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      cli_release_created: ${{ steps.release.outputs['packages/ampi-cli--release_created'] }}
      cli_tag_name: ${{ steps.release.outputs['packages/ampi-cli--tag_name'] }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Update the release PR or create the release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # npm provenance names the workflow's commit (GITHUB_SHA), so publish
      # only when that is the commit the release tag points to.
      - name: Verify provenance source
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag commit $actual differs from workflow commit $GITHUB_SHA; refusing to publish with wrong provenance. Re-run the publish from the release commit."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Gate
        run: npm run gate

      - name: Publish
        run: npm publish --provenance --access public

  publish-cli:
    name: Publish ampi-cli to npm
    needs: [release-please, publish]
    # Runs when the CLI was released, after the core package's publish job
    # succeeded or was skipped (no core release in this run).
    if: ${{ always() && needs.release-please.outputs.cli_release_created == 'true' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.cli_tag_name }}
          persist-credentials: false

      - name: Verify provenance source
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag commit $actual differs from workflow commit $GITHUB_SHA; refusing to publish with wrong provenance. Re-run the publish from the release commit."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Gate
        run: npm run gate

      - name: Publish
        working-directory: packages/ampi-cli
        run: npm publish --provenance --access public
