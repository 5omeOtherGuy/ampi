# Dependabot version updates: weekly, minor and patch grouped into one PR per
# ecosystem, majors as separate PRs, and a cooldown before adopting a new
# release. Docs:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      # The Pi packages move together, majors included: a new Pi major needs
      # code changes in the same PR.
      pi-agent-stack:
        patterns:
          - "@earendil-works/pi-*"
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Pinned to the exact version @earendil-works/pi-coding-agent uses; it
      # moves with the Pi packages, not on its own.
      - dependency-name: "typebox"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
